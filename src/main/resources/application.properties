# Outbox Publisher Configuration
outbox.publish.interval.ms=5000
outbox.batch.size=10
outbox.max.retries=5
outbox.backoff.millis=1000

# Kafka Configuration (for local development)
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.group-id=notification-processor
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false

# Spring Boot Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.health.redis.enabled=true
management.health.db.enabled=true
management.health.kafka.enabled=true

# Micrometer Configuration
management.metrics.enable.all=true
management.metrics.enable.jvm=true
management.metrics.enable.logback=true
management.metrics.enable.process=true


# Logging configuration for correlation IDs
logging.pattern.level=%5p [${spring.application.name:-},%X{traceId:-},%X{spanId:-}]